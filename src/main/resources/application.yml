server:
  port: ${PORT:${SERVER_PORT:8085}}


spring:
  application:
    name: ip-shakti-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://ep-broad-brook-aexnflhy-pooler.c-2.us-east-2.aws.neon.tech:5432/neondb?sslmode=require}
    username: ${SPRING_DATASOURCE_USERNAME:neondb_owner}
    password: ${SPRING_DATASOURCE_PASSWORD:npg_4rwHVRYI6bnj}
    driver-class-name: org.postgresql.Driver
  jpa:
    database: postgresql
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  mail:
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

# IP-SHAKTI RAG & LangChain4j Vector Configuration
rag:
  corpus:
    path: "data/raw"
  embedding:
    # IMPORTANT DIMENSION CHECK:
    # all-MiniLM-L6-v2 produces vectors of EXACTLY 384 dimensions.
    # If switching to Google text-embedding-004, change to 768.
    # If switching to OpenAI text-embedding-3-small, change to 1536.
    dimension: 384
  vector-store:
    table-name: "legal_document_embeddings"
    create-table: true
    drop-table-first: false

# Google AI Studio Gemini LLM Configuration (LangChain4j)
gemini:
  api-key: ${GEMINI_API_KEY:}
  model-name: ${GEMINI_MODEL:gemini-flash-lite-latest}
  temperature: 0.1
  max-output-tokens: 2048
