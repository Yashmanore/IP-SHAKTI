version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ipshakti-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ipshakti_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always

volumes:
  pgdata:
