server:
  port: 8080

spring:
  application:
    name: ip-shakti-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ipshakti_db}}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USER:postgres}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:postgrespassword}}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

# IP-SHAKTI RAG & LangChain4j Vector Configuration
rag:
  corpus:
    path: "data/raw"
  embedding:
    # IMPORTANT DIMENSION CHECK:
    # all-MiniLM-L6-v2 produces vectors of EXACTLY 384 dimensions.
    # If switching to Google text-embedding-004, change to 768.
    # If switching to OpenAI text-embedding-3-small, change to 1536.
    dimension: 384
  vector-store:
    table-name: "legal_document_embeddings"
    create-table: true
    drop-table-first: false
